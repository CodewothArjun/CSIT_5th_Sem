<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex table</title>
</head>
<body>
    <table >
        <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
            <td>D</td>
        </tr>
        <tr>
            <td colspan="3" rowspan="2">E</td>
            <td>F</td>
        </tr>
        <tr>
            <td>G</td>
        </tr>
        <tr>
            <td colspan="2">H</td>
            <td>J</td>
            <td>K</td>
        </tr>
        <tr>
            <td colspan="2">L</td>
            <td colspan="2">M</td>
        </tr>
    </table>
</body>
</html>
