<!DOCTYPE html>
<html>
  <head>
    <title>Image as List Items</title>
  </head>
  <body>
    <h2>Image List (Unordered):</h2>
    <ul>
      <li>
        <img
          src="coding.png" alt="Image 1" width="30"
        />
      </li>
      <li>
        <img src="program.png" alt="Image 2" width="30" />
      </li>
    </ul>
    <h2>Image List (Ordered):</h2>
    <ol>
      <li>
        <img
          src="robotic-hand.png" alt="Image 1" width="30"
        />
      </li>
      <li>
        <img src="technology.png" alt="Image 2" width="30" />
      </li>
    </ol>
  </body>
</html>
