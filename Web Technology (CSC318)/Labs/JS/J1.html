<!DOCTYPE html>
<html>
<head>
  <title>JavaScript Popups</title>
  <script>
    // Alert Box Example
    function showAlert() {
      alert("This is an Alert box!\nIt gives information to the user.");
    }

    // Confirm Box Example
    function showConfirm() {
      let result = confirm("Do you want to continue?");
      if (result) {
        alert("You pressed OK!");
      } else {
        alert("You pressed Cancel!");
      }
    }

    // Prompt Box Example
    function showPrompt() {
      let name = prompt("What is your name?");
      if (name != null && name != "") {
        alert("Hello, " + name + "!");
      } else {
        alert("You didn’t enter your name.");
      }
    }
  </script>
</head>
<body>

  <h2>JavaScript Alert, Confirm, and Prompt Box</h2>

  <button onclick="showAlert()">Show Alert</button><br><br>
  <button onclick="showConfirm()">Show Confirm</button><br><br>
  <button onclick="showPrompt()">Show Prompt</button>

</body>
</html>
